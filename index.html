    <meta property="og:description" content="Dashboard analítico para ordens de serviço com mapeamento heurístico, análise estatística (Z-Score, Pareto), Naive Bayes e simulador What-If de ROI." />

    <!-- SheetJS (XLSX) & Plotly.js Core com crossorigin anonymous e tolerância a falhas -->
    <script>
      // Suprime notificações de ResizeObserver em loop e erros não-bloqueantes de scripts externos
      window.addEventListener('error', function (event) {
        if (event.message === 'Script error.' || (typeof event.message === 'string' && event.message.includes('ResizeObserver'))) {
          event.stopImmediatePropagation();
        }
      });
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" crossorigin="anonymous"></script>

  </body>
